# Build and deploy the web app to GitHub Pages.
# Metadata (tools-index.json, tools/*.json) is built in the data repo; this workflow
# fetches it and runs next build only (no Python, fast CI).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch metadata from data repo
        if: vars.DATA_REPO != ''
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          METADATA_PATH: ${{ vars.METADATA_PATH || 'metadata' }}
        run: |
          git clone --depth 1 --branch main "https://github.com/${DATA_REPO}.git" data-repo
          mkdir -p web/public/tools
          cp "data-repo/${METADATA_PATH}/tools-index.json" web/public/
          cp data-repo/${METADATA_PATH}/tools/"*.json" web/public/tools/

      - name: Setup Python (when building index from local data)
        if: vars.DATA_REPO == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build index from local data
        if: vars.DATA_REPO == ''
        env:
          DATA_REPO_URL: ${{ vars.DATA_REPO_URL }}
        run: npm run index
        working-directory: web

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build (Next.js export)
        run: npm run build
        working-directory: web

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
