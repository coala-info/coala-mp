# Build and deploy the web app to GitHub Pages.
# Metadata (tools-index.json, tools/*.json) is built separately; ensure it is present
# in web/public/ (e.g. committed or from another workflow) before this runs.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build (Next.js export)
        run: npm run build
        working-directory: web

      # Next.js exports _next at out/ root but HTML references /mp/_next/...; put everything under mp/ for GitHub Pages.
      - name: Restructure output for basePath /mp
        run: |
          cd web/out
          mkdir -p mp
          for name in _next tool tools 404; do [ -e "$name" ] && mv "$name" mp/; done
          for f in *.html *.json *.txt; do [ -f "$f" ] && mv "$f" mp/; done

      # Pages must be enabled manually first: Settings → Pages → Build and deployment → Source: GitHub Actions.
      # Do not use enablement: true here; it requires token permissions the integration does not have.
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
