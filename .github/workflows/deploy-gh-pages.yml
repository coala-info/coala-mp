# Build static export and push web/out/mp/ into the organisation GitHub Pages repo
# so the app is served at https://coala.info/mp/
name: Deploy to coala.info/mp

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-coala-mp-site
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build (Next.js export)
        env:
          COALA_MP_BASE_PATH: ${{ vars.COALA_MP_BASE_PATH || '/mp' }}
        run: npm run build
        working-directory: web

      - name: Restructure output under out/mp/
        run: |
          cd web/out
          mkdir -p mp
          for name in _next tool tools 404; do ([ -e "$name" ] && mv "$name" mp/) || true; done
          shopt -s nullglob
          for f in *.html *.json *.txt *.svg *.png *.ico *.webp; do
            [ -f "$f" ] || continue
            mv "$f" mp/
          done
          shopt -u nullglob

      - name: Publish to organisation site (mp/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.COALA_SITE_TOKEN }}
          # Override with repository variable COALA_SITE_REPO if your Pages repo differs.
          external_repository: ${{ vars.COALA_SITE_REPO || 'coala-info/coala-info.github.io' }}
          publish_branch: ${{ vars.COALA_SITE_BRANCH || 'main' }}
          publish_dir: ./web/out/mp
          destination_dir: mp
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
